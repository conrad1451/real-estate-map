# This file defines the types for your GraphQL API.
# It is used by graphql-codegen to understand the structure of your data.

# The root Query type defines all available read operations.
type Query {
  "Fetches a list of all real estate locations."
  locations: [Location!]!
  "Fetches a list of all episodes, likely for a podcast or video series."
  episodes: [Episode!]!
}

# The Location type represents a single property listing.
type Location {
  id: ID!
  name: String!
  description: String
  photo: String # Assuming this is a URL or file path string
}

# A new type definition to support the 'episodes' query.
type Episode {
  id: ID!
  name: String!
  air_date: String!
}
